<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a668b"/><stop offset=".5" stop-color="#c03945"/><stop offset="1" stop-color="#437fb1"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a27"/><stop offset="1" stop-color="#0b111a"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="720" fill="#080d14"/>
  <rect y="76" width="1440" height="2" fill="url(#glow)"/>
  <text x="120" y="190" fill="#f4f7fb" font-family="Montserrat, Arial, sans-serif" font-size="38" font-weight="700">Simpy</text>
  <text x="120" y="230" fill="#91a0b3" font-family="Montserrat, Arial, sans-serif" font-size="17">Проект для портфолио</text>
  <text x="120" y="300" fill="#d6deea" font-family="Montserrat, Arial, sans-serif" font-size="17">Учебный сайт о статьях и публикациях.</text>
  <text x="120" y="330" fill="#d6deea" font-family="Montserrat, Arial, sans-serif" font-size="17">Создан в некоммерческих целях.</text>
  <text x="865" y="190" fill="#f4f7fb" font-family="Montserrat, Arial, sans-serif" font-size="21" font-weight="600">Данные и конфиденциальность</text>
  <rect x="865" y="215" width="450" height="3" rx="1.5" fill="url(#glow)"/>
  <text x="865" y="265" fill="#cbd5e1" font-family="Montserrat, Arial, sans-serif" font-size="16">
    <tspan x="865" dy="0">Данные регистрации используются только для</tspan>
    <tspan x="865" dy="29">работы учётной записи и публикации материалов.</tspan>
    <tspan x="865" dy="29">Они не используются для рекламы и массовых</tspan>
    <tspan x="865" dy="29">рассылок и не передаются третьим лицам, кроме</tspan>
    <tspan x="865" dy="29">случаев, необходимых для работы сайта или</tspan>
    <tspan x="865" dy="29">предусмотренных законом.</tspan>
  </text>
  <rect x="865" y="483" width="450" height="84" rx="12" fill="url(#card)" stroke="#283647"/>
  <text x="889" y="516" fill="#91a0b3" font-family="Montserrat, Arial, sans-serif" font-size="14">Вопрос по учётной записи?</text>
  <text x="889" y="546" fill="#8bb9e2" font-family="Montserrat, Arial, sans-serif" font-size="16" font-weight="600">Напишите автору проекта  ↗</text>
  <rect x="120" y="620" width="1200" height="1" fill="#263241"/>
  <text x="120" y="666" fill="#718096" font-family="Montserrat, Arial, sans-serif" font-size="14">© 2026 Simpy · Учебный проект для портфолио</text>
  <text x="1320" y="666" text-anchor="end" fill="#718096" font-family="Montserrat, Arial, sans-serif" font-size="14">Политика конфиденциальности</text>
</svg>
