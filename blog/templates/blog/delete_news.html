{% extends "blog/base.html" %}

{% block title %}Удаление статьи {% endblock %}
{% block content %}
    <main class="delArticleMain">
        <div class="delArticle">
            <h3>Вы точно хотите удалить статью: <i>"{{ title }}"</i>?</h3>
            <form method="POST" class="delArticleForm">
                {% csrf_token %}
                <div class='delButtons'>
                    <button type="submit">Да, удалить</button>
                    <a class='del' href='{% url 'news-detail' object.id %}'>Отмена</a>
                </div>
            </form>
        </div>
    </main>
{% endblock %}
