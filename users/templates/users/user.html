{% extends "blog/base.html" %}

{% block title %}Страница авторизации{% endblock %}
{% block content %}
    <main class="registerMain">
        <div class="register">
            <h2>Страница авторизации</h2>
            <form method="POST" class="registerForm">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Войти</button>
                <p style='margin: 1% 0' class='altbut'>Забыли пароль? <a class='alt' href="{% url 'pass-reset' %}">Восстановить пароль</a></p>
                <p class='altbut'>Впервые на сайте? <a class='alt' href="{% url 'reg' %}">Зарегистрироваться</a></p>
            </form>
        </div>
    </main>
{% endblock %}
