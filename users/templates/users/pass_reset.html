{% extends "blog/base.html" %}

{% block title %}Восстановление пароля{% endblock %}
{% block content %}
    <main class="registerMain">
        <div class="register">
            <h2>Восстановление пароля</h2>
            <form method="POST" class="registerForm">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Запросить новый пароль</button>
            </form>
        </div>
    </main>
{% endblock %}
